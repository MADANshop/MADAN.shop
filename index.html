<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MADAN — Produkte</title>
  <meta name="description" content="MADAN Produktübersicht" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top">
     <img class="brand-logo" src="logo.png" alt="MADAN Logo" />
      <span class="wordmark">MADAN</span>
    </a>
  </header>

  <main id="top">
    <section class="intro">
      <h1>Produkte</h1>
      <p class="intro-text">Ein Überblick über alles, was wir bauen. Auf ein Produkt klicken für Details.</p>
    </section>

    <section class="product-grid" id="product-grid" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> MADAN</span>
  </footer>

  <div class="overlay" id="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <button class="close-btn" id="close-btn" aria-label="Schließen">
        <span aria-hidden="true">&times;</span>
      </button>
      <div id="panel-content"></div>
    </div>
  </div>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
