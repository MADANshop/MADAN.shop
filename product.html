<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MADAN — Produkt</title>
  <meta name="description" content="Produktdetails von MADAN" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html#top">
      <img class="brand-logo" src="logo.png" alt="MADAN Logo" />
      <span class="wordmark">MADAN</span>
    </a>

    <a
      class="cart-toggle product-page-cart"
      href="index.html#cart"
      aria-label="Warenkorb öffnen"
    >
      <img class="cart-icon" src="cart.png" alt="" aria-hidden="true" />
      <span class="cart-count" id="cart-count" hidden>0</span>
    </a>
  </header>

  <main class="product-page" id="top">
    <div class="product-page-inner">
      <a class="product-back-link" href="index.html">
        <span aria-hidden="true">←</span>
        Zurück zu Produkten
      </a>

      <div class="product-page-content" id="product-content">
        <p class="product-page-eyebrow" id="product-category"></p>
        <h1 class="product-page-title" id="product-name"></h1>

        <section
          class="product-gallery"
          id="product-gallery"
          aria-label="Produktbilder"
          hidden
        >
          <div
            class="product-gallery-stage"
            id="gallery-stage"
            role="group"
            aria-label="Produktbilder. Mit den Pfeiltasten kannst du die Bilder wechseln."
            tabindex="0"
          >
            <button
              class="gallery-arrow gallery-arrow--prev"
              id="gallery-prev"
              type="button"
              aria-label="Vorheriges Bild"
              hidden
            >
              ←
            </button>

            <img
              class="product-gallery-image"
              id="product-image"
              alt=""
            />

            <button
              class="gallery-arrow gallery-arrow--next"
              id="gallery-next"
              type="button"
              aria-label="Nächstes Bild"
              hidden
            >
              →
            </button>

            <span
              class="product-gallery-counter"
              id="gallery-counter"
              aria-live="polite"
            ></span>
          </div>

          <div
            class="product-gallery-dots"
            id="gallery-dots"
            role="group"
            aria-label="Produktbild auswählen"
            hidden
          ></div>
        </section>

        <p class="product-page-price" id="product-price" hidden></p>

        <section class="product-description-area">
          <h2>Beschreibung</h2>
          <div class="product-page-description" id="product-description"></div>
        </section>

        <div class="product-page-actions">
          <button
            class="btn-add-cart"
            id="product-add-to-cart"
            type="button"
          >
            In den Warenkorb
          </button>

          <a
            class="cart-etsy-link product-etsy-link"
            id="product-etsy-link"
            target="_blank"
            rel="noopener"
            hidden
          >
            Bei Etsy kaufen ↗
          </a>
        </div>
      </div>

      <section class="product-not-found" id="product-not-found" hidden>
        <h1>Produkt nicht gefunden</h1>
        <p>Dieses Produkt ist in unserem Shop nicht verfügbar.</p>
        <a href="index.html">Zurück zu Produkten</a>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> MADAN</span>
  </footer>

  <script src="products.js"></script>
  <script src="product-page.js"></script>
</body>
</html>
